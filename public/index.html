<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>H&F Karadaş Hair Artist | Giriş</title>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="page">
      <!-- SOL TARAF -->
      <section class="hero">
        <img class="hero-logo" src="assets/karadas.jpeg" alt="H&F Karadaş Hair Artist Logosu" />
        <h1 class="hero-title">H&F Karadaş Hair Artist</h1>
        <p class="hero-subtitle">
          H&F Karadaş Hair Artist yönetim sistemi. <br />
          Randevularınızı kolayca oluşturun ve yönetin.
        </p>

        <ul class="hero-features">
          <li>✨ Kolay Randevu</li>
          <li>📦 Stok Takibi</li>
          <li>📊 Profesyonel Yönetim</li>
        </ul>

        <!-- MÜŞTERİ YORUMLARI -->
        <div class="reviews-section">
          <h3 class="reviews-title">Müşterilerimizden</h3>
          <div class="reviews-slider">
            <div class="reviews-track" id="reviews-track">
              <!-- JS ile doldurulacak -->
            </div>
          </div>
        </div>
      </section>

      <!-- SAĞ TARAF: GİRİŞ / KAYIT KARTI -->
      <section class="auth-wrapper">
        <div class="auth-card">
          <h2>Hoş Geldiniz</h2>
          <p class="auth-text">
            Hesabınıza giriş yapın veya yeni hesap oluşturun.
          </p>

          <!-- Rol seçimi -->
          <div class="toggle-group" id="role-toggle">
            <button class="toggle-btn active" data-role="customer">
              Müşteri
            </button>
            <button class="toggle-btn" data-role="barber">Kuaför</button>
          </div>

          <!-- Giriş / Kayıt seçimi -->
          <div class="toggle-group" id="mode-toggle">
            <button class="toggle-btn active" data-mode="login">
              Giriş Yap
            </button>
            <button class="toggle-btn" data-mode="register">Kayıt Ol</button>
          </div>

          <!-- FORM -->
          <form id="auth-form" class="auth-form">
            <div class="form-group form-group-name">
              <label for="fullName">Ad Soyad</label>
              <input
                type="text"
                id="fullName"
                placeholder="Adınızı ve soyadınızı girin"
              />
            </div>

            <div class="form-group">
              <label for="email">E-posta</label>
              <input
                type="email"
                id="email"
                placeholder="ornek@email.com"
                required
              />
            </div>

            <div class="form-group form-group-phone">
              <label for="phone">Telefon (isteğe bağlı)</label>
              <input
                type="tel"
                id="phone"
                placeholder="05xx xxx xx xx"
              />
            </div>

            <!-- ✅ YENİ: Kuaför Davet Kodu (sadece Kuaför + Kayıt Ol iken gösterilecek) -->
            <div class="form-group" id="barber-code-group" style="display: none;">
              <label for="inviteCode">Kuaför Davet Kodu</label>
              <input
                type="text"
                id="inviteCode"
                placeholder="Örn: KUAFOR-ABC-123"
              />
            </div>
            <!-- ✅ YENİ BİTİŞ -->

            <div class="form-group">
              <label for="password">Şifre</label>
              <input
                type="password"
                id="password"
                placeholder="Şifrenizi girin"
                required
              />
            </div>

            <button type="submit" class="primary-btn" id="submit-btn">
              Giriş Yap
            </button>
          </form>

          <p id="auth-message" class="auth-message"></p>
        </div>
      </section>
    </div>

    <script src="auth.js"></script>
    <script>
      // Yorumları yükle ve kaydır
      async function loadReviews() {
        try {
          const res = await fetch('/api/reviews');
          const reviews = await res.json();
          
          const track = document.getElementById('reviews-track');
          if (!reviews || reviews.length === 0) {
            track.innerHTML = '<div class="review-card"><p style="color: #6b7280;">Henüz yorum yok.</p></div>';
            return;
          }

          // Yorumları 2 kez ekle (sonsuz döngü için)
          const allReviews = [...reviews, ...reviews];
          
          track.innerHTML = allReviews.map(r => {
            const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
            const customerName = r.customer?.fullName || 'Müşteri';
            const message = r.message || 'Harika bir deneyimdi!';
            
            return `
              <div class="review-card">
                <div class="review-stars">${stars}</div>
                <p class="review-message">${message}</p>
                <p class="review-author">— ${customerName}</p>
              </div>
            `;
          }).join('');

          // Animasyonu başlat
          const totalWidth = track.scrollWidth;
          const duration = totalWidth / 70; // Hız ayarı (px/s) - Orta hız
          track.style.animation = `slide ${duration}s linear infinite`;
        } catch (err) {
          console.error('Yorumlar yüklenirken hata:', err);
        }
      }

      loadReviews();
    </script>

    <!-- Gece Modu Toggle Tuşu -->
    <button class="dark-mode-toggle" id="dark-mode-toggle" title="Gece Modunu Aç/Kapat">🌙</button>
  </body>
</html>
